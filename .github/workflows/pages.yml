name: Project site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
      - "miniapps/*/store/*.png"
      - "apps/staff-desktop/docs/screenshots/*.png"
      - "apps/staff-mobile/docs/screenshots/*.png"
      - "apps/web/public/icon-*.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: bash scripts/build-site.sh "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
