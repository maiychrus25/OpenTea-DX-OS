name: Project site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
      - "miniapps/*/store/*.png"
      - "apps/staff-desktop/docs/screenshots/*.png"
      - "apps/staff-mobile/docs/screenshots/*.png"
      - "apps/web/public/icon-*.png"
      - "scripts/build-docs.py"
      - "docs/**"
      - "DESIGN.md"
      - "README.md"
      - "CHANGELOG.md"
      - "DEPENDENCIES.md"
      - "LICENSE"
      - "apps/hub-mobile/README.md"
      - "apps/staff-desktop/README.md"
      - "apps/staff-mobile/README.md"
      - "miniapps/*/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Markdown build tool (Python-Markdown, BSD-3-Clause)
        run: python3 -m pip install "markdown==3.7"
      - name: Assemble the site
        run: bash scripts/build-site.sh "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
