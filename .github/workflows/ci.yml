name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Reused by release.yml so a tag is only published after the full quality gate passes.
  workflow_call:

jobs:
  # ─── Stage 1: Fast checks (lint) ────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Validate Prisma Schema
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: ESLint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript Compile Check
        working-directory: apps/web
        run: npx tsc --noEmit

  lint-backend:
    name: Lint FastAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/disease-api/requirements*.txt

      - name: Install dependencies
        working-directory: apps/disease-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax Check
        working-directory: apps/disease-api
        run: python -m py_compile app/main.py

      - name: Test
        working-directory: apps/disease-api
        run: python -m pytest tests -q -W error

  lint-n8n:
    name: Lint n8n Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON format
        run: |
          for file in workflows/*.json; do
            jq . "$file" > /dev/null || (echo "❌ Invalid JSON in $file" && exit 1)
          done
          echo "✅ All workflows are valid JSON"

  # ─── Stage 2: Tests (depends on lint) ───────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Run Jest
        working-directory: apps/web
        run: npm test -- --ci --passWithNoTests --coverage
        env:
          AUTH_SECRET: "ci-dummy-secret-key-for-test-only"

  # ─── Stage 3: Story 0.1 browser smoke (depends on lint) ─────────────
  e2e-story-0-1:
    name: Story 0.1 Browser Smoke
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Story 0.1 smoke
        working-directory: apps/web
        run: npm run test:e2e:story-0-1
        env:
          AUTH_SECRET: ci-dummy-secret-key-for-e2e

  # ─── Stage 4: Build (depends on lint) ───────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npx prisma generate

      - name: Build Standalone
        working-directory: apps/web
        env:
          AUTH_SECRET: "ci-dummy-secret-key-for-build-only"
        run: npm run build

  # ─── Stage 4: Infrastructure validation ─────────────────────────────
  validate-infrastructure:
    name: Validate Scripts & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Env and Structure
        run: |
          bash scripts/validate-env.sh
          bash scripts/validate-structure.sh

  # ─── Stage 5: Docker smoke test (depends on infra + build) ──────────
  smoke-test-docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [validate-infrastructure, build, lint-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Environments
        run: |
          cp .env.example .env.local
          cp docker/.env.local.example docker/.env.local

      - name: Start Services
        run: |
          # Only start core infrastructure services for smoke test.
          # Docker Hub rate limits prevent pulling optional images in CI.
          # postgres (postgres:16-alpine) and keycloak (quay.io) are reliable.
          docker compose -f docker/docker-compose.yml up -d postgres keycloak

      - name: Run Smoke Test
        run: |
          sleep 20
          bash scripts/smoke-test.sh

      - name: Docker Logs on Failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

  # ─── Tier 1 platform: gateway, identity, data API ───────────────────
  platform-smoke:
    name: Platform Smoke Test
    runs-on: ubuntu-latest
    # About 16 min before the A3 story; disease-api's image, the seed and the two browser specs add roughly 10.
    # The tea-tour image, its story and apps-smoke (another platform-up and platform-smoke) add roughly 8.
    # The store and the three business apps add about 7: locally the worker, the two stories, the screens and the installs take
    # about 3.5 min, the three image builds 13 s each (cold runners: more), and the new pytest suites need their own pip installs.
    # That is about 41 min, too close to the old 45 for a runner a little slower; a timeout would lose the release gate.
    timeout-minutes: 60
    needs: [lint]
    # As in the Makefile: the raw compose and docker build steps below must not make a new image ID per build either.
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Prepare Environments
        run: |
          cp .env.example .env.local
          cp docker/.env.local.example docker/.env.local

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scanner Unit Tests
        run: cd platform/scanner && python -m pip install -r requirements-dev.txt && python -m pytest tests -q -W error

      - name: Dataops Unit Tests
        run: cd platform/dataops && python -m pip install -r requirements-dev.txt && python -m pytest tests -q -W error

      # The registry tests start a throwaway Postgres from this image; Start Platform reuses its build cache.
      - name: DXOS CLI Unit Tests
        run: |
          docker build -q -t opentea-dx-os/postgres:local platform/postgres
          cd platform/cli && python -m pip install -r requirements-dev.txt && python -m pytest tests -q -W error

      - name: Validate Mini-app Manifests
        # The repo root is the working directory: validate reads the core version from apps/web/package.json.
        run: PYTHONPATH=platform/cli python -m dxos_cli validate miniapps/*

      - name: Mini-app Kit Check
        run: bash scripts/appkit-sync.sh --check

      - name: Mini-app Kit Unit Tests
        run: cd platform/appkit && python -m pip install -r ../../miniapps/tea-shop/requirements-dev.txt && python -m pytest tests -q -W error

      - name: Mini-app Unit Tests
        run: |
          (cd miniapps/hello && python -m unittest -v)
          for app in tea-tour leaf-purchase tea-shop farm-supply custom-books; do
            (cd "miniapps/$app" && python -m pip install -r requirements-dev.txt && python -m pytest tests -q -W error)
          done

      # The Ollama image alone unpacks to several GB; the runner's preinstalled SDKs leave too little disk for the full stack.
      - name: Free Runner Disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Start Platform
        run: make platform-up

      - name: Realm Policy Test
        run: python3 platform/tests/test_realm_policy.py

      # Demo data for the A3 story and the screens; the smoke test passes with or without it.
      - name: Seed Demo Data
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://agrimarket:your_password_here@localhost:5432/agrimarket
        run: |
          npx prisma generate
          npm run seed

      - name: Platform Smoke Test
        run: make platform-smoke

      - name: Start Web
        # make web-up uses the same gateway file as make platform-up, so starting web does not recreate apisix on the base file.
        env:
          # Every browser spec comes from one IP, so a Playwright retry must not hit the public 10/min limit.
          DXOS_APP_PUBLIC_LIMIT: "1000"
        run: make web-up

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Core Tenant Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_BASE_URL: http://localhost:3000
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null "$E2E_BASE_URL/login"
          npx playwright test tests/e2e/tenant/core-tenant.spec.ts --project=chromium --no-deps --reporter=list

      - name: A3 Story Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/tea-a3.spec.ts --project=chromium --no-deps --reporter=list

      - name: Install Tea Tour App
        run: ./dxos install miniapps/tea-tour

      - name: Tea Tour Story Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_TEA_TOUR: installed
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/tea-tour.spec.ts --project=chromium --no-deps --reporter=list

      # Sample data through the app, then the kit in the shell: lists in two pages, CSV download, print page and the way back.
      - name: App Kit Tea Tour Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_APP_KIT: tea-tour
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/app-kit.spec.ts --project=chromium --no-deps --reporter=list

      # After the tea tour story, so the tea-tour pages hold a tour.
      - name: Priority Screens Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_TEA_TOUR: installed
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/visual/screens.spec.ts --project=chromium --no-deps --reporter=list

      - name: Remove Tea Tour App
        run: ./dxos remove tea-tour

      - name: Tea Tour Removal Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_TEA_TOUR: removed
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/tea-tour.spec.ts --project=chromium --no-deps --reporter=list

      # The store stories press Cài and Gỡ, which only queue requests: ./dxos worker does the work. It runs in the background
      # until the stories and screens are done; apps-smoke starts a worker of its own, and a second one would be refused.
      - name: Start App Store Worker
        run: |
          nohup ./dxos worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          for _ in $(seq 1 60); do grep -q 'worker started' "$RUNNER_TEMP/worker.log" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/worker.log"
          exit 1

      # Installs tea-shop for TC from the page, so the screens below find it.
      - name: App Store Story Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_APP_STORE: "1"
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/app-store.spec.ts --project=chromium --no-deps --reporter=list --trace retain-on-failure

      - name: Install Business Apps
        run: |
          ./dxos install miniapps/leaf-purchase
          ./dxos install miniapps/farm-supply

      - name: Business Apps Story Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_BUSINESS_APPS: installed
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/business-apps.spec.ts --project=chromium --no-deps --reporter=list --trace retain-on-failure

      - name: App Kit Business Apps Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_APP_KIT: business
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/story/app-kit.spec.ts --project=chromium --no-deps --reporter=list --trace retain-on-failure

      # Only the screens of the store and the three apps; Priority Screens above ran the rest.
      - name: Business Apps Screens Browser Test
        working-directory: apps/web
        env:
          E2E_CORE: "1"
          E2E_BUSINESS_APPS: installed
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/visual/screens.spec.ts --project=chromium --no-deps --reporter=list --trace retain-on-failure --grep 'app-store|leaf-purchase|tea-shop|farm-supply'

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-screens
          path: apps/web/test-results/screens/
          if-no-files-found: ignore
          retention-days: 14

      # Traces hold the page, its requests and the session of a throwaway CI stack.
      - name: Upload Browser Failure Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop App Store Worker
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/worker.pid" ] || exit 0
          kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          for _ in $(seq 1 40); do kill -0 "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || exit 0; sleep 1; done
          echo "worker did not stop within 40 s" >&2
          exit 1

      # apps-smoke purges these apps and refuses to start while one is installed.
      - name: Remove Business Apps
        run: |
          for app in tea-shop leaf-purchase farm-supply; do ./dxos remove "$app"; done

      # Installs hello, tea-tour, the three business apps and the CLI fixtures, runs the store queue with a worker of its own,
      # re-runs platform-up, removes them all, then runs platform-smoke.
      - name: Mini-app Smoke Test
        run: make apps-smoke

      - name: Docker Logs on Failure
        if: failure()
        run: |
          df -h /
          cat "$RUNNER_TEMP/worker.log" 2>/dev/null || true
          # Mini-app containers are not services of docker-compose.yml, so compose logs leaves them out.
          for name in $(docker ps -a --filter "name=-app-" --format '{{.Names}}'); do
            echo "== $name"
            docker logs --tail 200 "$name" 2>&1 || true
          done
          docker compose -f docker/docker-compose.yml logs
