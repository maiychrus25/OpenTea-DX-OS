name: Release

# Push a SemVer tag (vX.Y.Z or vX.Y.Z-rc.N) to publish versioned images to GHCR
# and a GitHub Release with the CHANGELOG notes and the deployment bundle.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version & changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against package.json and CHANGELOG.md
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Quality gate
    needs: verify
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ${{ matrix.service }} image
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: web
            context: ./apps/web
          - service: api
            context: ./apps/disease-api
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tags: X.Y.Z always; X.Y and latest only for stable (non pre-release) versions.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish:
    name: Create GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment bundle
        run: bash scripts/package-release.sh "$VERSION" dist

      - name: Write release notes
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            bash scripts/release-notes.sh "$VERSION"
            cat <<EOF

          ## Container images

          - \`${prefix}-web:${VERSION}\`
          - \`${prefix}-api:${VERSION}\`

          ## Deploy

          Download \`opentea-dx-os-${VERSION}.tar.gz\`, verify it with \`SHA256SUMS\`, then follow the
          [release deployment guide](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/README.md#-bản-phát-hành-releases).
          EOF
          } > dist/notes.md

      - name: Publish GitHub Release
        run: |
          flags=(--verify-tag --title "OpenTea DX-OS v${VERSION}" --notes-file dist/notes.md)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            "dist/opentea-dx-os-${VERSION}.tar.gz" dist/SHA256SUMS "${flags[@]}"
