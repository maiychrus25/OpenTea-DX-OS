apiVersion: dxos/v1
id: htx-dashboard
name: Bảng điều hành HTX
description: "Một góc nhìn tổng thể về hợp tác xã: việc cần chú ý, sản xuất, thửa chè với số đo cảm biến, sức khoẻ cây, lô chè và vòng đời dữ liệu."
version: 0.1.0
license: MIT
publisher: OpenTea Developers
requires: { core: ">=1.13.0" }
runtime:
  build: .
  port: 8080
  health: /healthz
routes:
  protected:
    /: [manager]
menu:
  - { label: Bảng điều hành, path: /, roles: [manager] }
store:
  category: production
  icon: clipboard-list
  about: |
    Ứng dụng giúp trưởng HTX theo dõi tổng thể hợp tác xã của mình trên một màn hình, chỉ để xem.

    Trang Tổng quan nêu ngay những việc cần chú ý: nhật ký chờ duyệt quá lâu, báo cáo bệnh chờ xử lý, cảm biến ngừng gửi số đo, vụ sắp hoặc đã quá ngày thu hoạch, lần chuyển dữ liệu bị lỗi. Phía dưới là các chỉ số về quy mô, nhật ký, sức khoẻ cây, cảm biến và lô chè, cùng lưới các thửa để mở nhanh.

    Mỗi thửa có một trang bản sao số: số đo mới nhất của từng cảm biến, biểu đồ theo ngày, vụ hiện tại, thời tiết, nhật ký, báo cáo bệnh và các lô có thửa đó. Các tab Sản xuất, Vùng trồng, Sức khoẻ cây, Lô chè và Dữ liệu đều có tệp CSV và bản in.

    Ứng dụng không lưu gì: mọi con số được đọc từ hệ thống lõi bằng chính quyền của người đang xem, nên chỉ thấy dữ liệu của HTX mình. Trang không tự cập nhật; tải lại để thấy số mới.
  data:
    - "App không lưu dữ liệu"
  personal_data: "Hiện tên hộ và mã thửa của HTX cho trưởng HTX; không lưu."
  core_reads:
    - "Hộ, thửa, vụ canh tác và năng suất ước tính"
    - "Nhật ký canh tác và báo cáo bệnh"
    - "Lô chè và các thửa của lô"
    - "Số đo cảm biến mới nhất và thống kê theo ngày"
    - "Các lần chuyển dữ liệu cảm biến sang kho lạnh và kết quả kiểm chất lượng"
    - "Thời tiết mới nhất của thửa và giá thị trường"
  screenshots:
