apiVersion: dxos/v1
id: htx-dashboard
name: Bảng điều hành HTX
description: "Bảng điều hành biểu đồ cho trưởng HTX: việc cần chú ý, xu hướng so với kỳ trước, sản xuất, cảm biến, sức khoẻ cây, lô chè và vòng đời dữ liệu."
version: 0.2.0
license: MIT
publisher: OpenTea Developers
requires: { core: ">=1.13.0" }
runtime:
  build: .
  port: 8080
  health: /healthz
routes:
  protected:
    /: [manager]
menu:
  - { label: Bảng điều hành, path: /, roles: [manager] }
store:
  category: production
  icon: clipboard-list
  about: |
    Ứng dụng giúp trưởng HTX nhìn ra tình hình hợp tác xã bằng biểu đồ, trên một màn hình, chỉ để xem.

    Trang Tổng quan mở đầu bằng các chỉ số kèm xu hướng so với kỳ trước, rồi đến những việc cần chú ý: nhật ký chờ duyệt quá lâu, báo cáo bệnh chờ xử lý, cảm biến ngừng gửi số đo, vụ sắp hoặc đã quá ngày thu hoạch, lần chuyển dữ liệu bị lỗi. Phía dưới là lưới biểu đồ: thửa theo trạng thái và cây trồng, hoạt động theo tuần, lô chè qua các giai đoạn, số đo cảm biến theo ngày, sức khoẻ cảm biến từng thửa, báo cáo bệnh, lịch thu hoạch và giá xuất khẩu.

    Mỗi thửa có một trang bản sao số: số đo mới nhất trong khoảng 30 ngày, biểu đồ theo ngày, nhiệt độ đặt cạnh độ ẩm, lượng mưa, vụ hiện tại, thời tiết, nhật ký, báo cáo bệnh và các lô có thửa đó. Các tab Sản xuất, Vùng trồng, Sức khoẻ cây, Lô chè và Dữ liệu đều có biểu đồ, tệp CSV và bản in.

    Ứng dụng không lưu gì: mọi con số được đọc từ hệ thống lõi bằng chính quyền của người đang xem, nên chỉ thấy dữ liệu của HTX mình. Trang không tự cập nhật; tải lại để thấy số mới.
  data:
    - "App không lưu dữ liệu"
  personal_data: "Hiện tên hộ và mã thửa của HTX cho trưởng HTX; không lưu."
  core_reads:
    - "Hộ, thửa, vụ canh tác và năng suất ước tính"
    - "Nhật ký canh tác và báo cáo bệnh"
    - "Lô chè và các thửa của lô"
    - "Số đo cảm biến mới nhất và thống kê theo ngày"
    - "Các lần chuyển dữ liệu cảm biến sang kho lạnh và kết quả kiểm chất lượng"
    - "Thời tiết mới nhất của thửa và giá thị trường"
  screenshots:
