    - { file: store/parcel.png, caption: "Bản sao số của một thửa: số đo mới nhất và biểu đồ theo ngày" }
    - { file: store/parcels.png, caption: "Vùng trồng: mọi thửa kèm số đo cảm biến mới nhất" }
    - { file: store/data.png, caption: "Dữ liệu: vòng đời, mã băm và chất lượng số đo cảm biến" }
