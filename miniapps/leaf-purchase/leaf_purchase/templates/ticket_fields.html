{#- Fields of the write and edit forms; needs form, households, grades, errors, core_error. -#}
  {% if errors %}{% include "errors.html" %}{% elif core_error %}<div class="error" role="alert">{{ core_error }}</div>{% endif %}
  <label>Hộ giao chè
    <select name="household" required>
      <option value="">Chọn nông hộ</option>
      {% for h in households %}<option value="{{ h.id }}"{% if form.household == h.id %} selected{% endif %}>{{ h.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Ngày cân <input type="date" name="weighed_on" required value="{{ form.weighed_on }}"></label>
  <label>Loại chè
    <select name="grade" required>
      <option value="">Chọn loại chè</option>
      {% for g in grades %}<option value="{{ g.id }}"{% if form.grade == g.id | string %} selected{% endif %}>{{ g.name }} ({{ g.price_vnd | vnd }}/kg)</option>{% endfor %}
    </select>
  </label>
  <label>Số ký (kg, dùng dấu phẩy cho số lẻ) <input name="kg" inputmode="decimal" maxlength="6" required value="{{ form.kg }}"></label>
