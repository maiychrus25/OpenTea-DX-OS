global_rules:
  - id: 1
    plugins:
      request-id:
        include_in_response: true
      cors:
        allow_origins: "${{DXOS_CORS_ORIGIN:=http://localhost:3000}}"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,x-hasura-role"
        expose_headers: "X-Request-Id"
      limit-count:
        # Skip the per-IP limit on the internal port: the web server calls from one container IP.
        _meta:
          filter: [["server_port", "~=", "9081"]]
        count: 300
        time_window: 60
        key: remote_addr
        rejected_code: 429

upstreams:
  - id: hasura
    nodes: { "hasura:8080": 1 }
  - id: n8n
    nodes: { "n8n:5678": 1 }
  - id: disease
    nodes: { "disease-api:8000": 1 }
  - id: storage
    nodes: { "minio:9000": 1 }
  - id: ollama
    nodes: { "ollama:11434": 1 }
  - id: web
    nodes: { "web:3000": 1 }

routes:
  - id: data-graphql
    uri: /api/data/graphql
    upstream_id: hasura
    plugins:
      openid-connect: &oidc
        bearer_only: true
        use_jwks: true
        discovery: http://keycloak:8080/realms/agrimarket/.well-known/openid-configuration
        client_id: dxos-gateway
        client_secret: "${{DXOS_GATEWAY_CLIENT_SECRET:=dev-gateway-secret}}"
      proxy-rewrite:
        uri: /v1/graphql
        # Never let a client supply the Hasura admin secret through the gateway.
        headers:
          remove: ["x-hasura-admin-secret"]
  - id: workflow
    uri: /api/workflow/*
    upstream_id: n8n
    plugins:
      openid-connect: &oidc_aud
        <<: *oidc
        # Hasura checks the audience itself; n8n and disease-api do not, so require dx-os-core here.
        # Agent tokens carry dx-os-core too, so user routes also refuse the agent role (spec §5.2).
        claim_schema:
          required: [aud]
          properties:
            aud:
              anyOf:
                - { enum: ["dx-os-core"] }
                - { type: array, contains: { enum: ["dx-os-core"] } }
            realm_access:
              properties:
                roles:
                  not: { contains: { enum: ["agent"] } }
      proxy-rewrite:
        regex_uri: ["^/api/workflow/(.*)", "/webhook/$1"]
  - id: disease
    uri: /api/ai/disease/*
    upstream_id: disease
    plugins:
      openid-connect: *oidc_aud
      proxy-rewrite:
        regex_uri: ["^/api/ai/disease/(.*)", "/$1"]
  # The only route to Ollama: its management APIs (/api/pull, /api/delete, /api/create) stay unreachable.
  - id: llm-chat
    uri: /api/ai/llm/v1/chat/completions
    methods: [POST]
    upstream_id: ollama
    timeout: { connect: 5, send: 120, read: 120 }
    plugins:
      openid-connect: *oidc_aud
      limit-count:
        count: 30
        time_window: 60
        # The web server is the only caller on :9081, so remote_addr would share one budget across users.
        key_type: var_combination
        key: "$remote_addr $http_authorization"
        rejected_code: 429
      proxy-rewrite:
        uri: /v1/chat/completions
  - id: storage
    uri: /storage/*
    upstream_id: storage
    plugins:
      proxy-rewrite:
        regex_uri: ["^/storage/(.*)", "/$1"]
  # Dedicated internal LLM route for dxos-agent so agent traffic has its own rate budget (spec §8.1).
  - id: internal-agent-llm
    uri: /api/internal/agent/llm/v1/chat/completions
    methods: [POST]
    priority: 10
    upstream_id: ollama
    timeout: { connect: 5, send: 120, read: 120 }
    vars: [["server_port", "==", "9081"]]
    plugins:
      openid-connect: &oidc_agent
        <<: *oidc
        claim_schema:
          required: [aud, azp, realm_access, htx_code]
          properties:
            aud:
              anyOf:
                - { enum: ["dx-os-core"] }
                - { type: array, contains: { enum: ["dx-os-core"] } }
            azp:
              type: string
              pattern: "^dxos-agent-[a-z0-9_-]{1,20}$"
            realm_access:
              required: [roles]
              properties:
                roles:
                  type: array
                  contains: { enum: ["agent"] }
            htx_code:
              type: string
              pattern: "^[A-Z0-9_-]{1,20}$"
      limit-count:
        count: 30
        time_window: 60
        key_type: var_combination
        key: "$remote_addr $http_authorization"
        rejected_code: 429
      proxy-rewrite:
        uri: /v1/chat/completions
  # Internal-only route for AI agents: unreachable on host port 9080, requires Keycloak agent role + HTX binding.
  - id: internal-agent
    uri: /api/internal/agent/*
    upstream_id: web
    vars: [["server_port", "==", "9081"]]
    plugins:
      openid-connect: *oidc_agent
      # Runs and proposals per agent token; the LLM routes above keep their own budget.
      limit-count:
        count: 120
        time_window: 60
        key_type: var_combination
        key: "$http_authorization"
        rejected_code: 429
      proxy-rewrite:
        headers:
          set:
            X-Dxos-Gateway: "${{DXOS_INTERNAL_GATEWAY_SECRET:=dev-internal-gateway-secret}}"
#END
