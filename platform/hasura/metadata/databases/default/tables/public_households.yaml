table:
  name: households
  schema: public
object_relationships:
  - name: htx_profile
    using:
      foreign_key_constraint_on: htx_profile_id
array_relationships:
  - name: parcels
    using:
      foreign_key_constraint_on:
        column: household_id
        table:
          name: parcels
          schema: public
select_permissions:
  - role: farmer
    permission:
      columns:
        - id
        - name
        - phone
        - address
        - keycloak_user_id
        - htx_profile_id
        - created_at
        - updated_at
      filter: {keycloak_user_id: {_eq: X-Hasura-User-Id}}
  - role: manager
    permission:
      columns:
        - id
        - name
        - phone
        - address
        - keycloak_user_id
        - htx_profile_id
        - created_at
        - updated_at
      filter: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
  - role: officer
    permission:
      columns:
        - id
        - name
        - phone
        - address
        - keycloak_user_id
        - htx_profile_id
        - created_at
        - updated_at
      filter: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
  - role: agent
    permission:
      columns:
        - id
        - htx_profile_id
        - created_at
        - updated_at
      allow_aggregations: true
      filter: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
