table:
  name: lots
  schema: public
object_relationships:
  - name: htx_profile
    using:
      foreign_key_constraint_on: htx_profile_id
array_relationships:
  - name: lot_parcels
    using:
      foreign_key_constraint_on:
        column: lot_id
        table:
          name: lot_parcels
          schema: public
select_permissions:
  - role: farmer
    permission:
      columns: '*'
      filter: {lot_parcels: {parcel: {household: {keycloak_user_id: {_eq: X-Hasura-User-Id}}}}}
  - role: manager
    permission:
      columns: '*'
      filter: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
  - role: officer
    permission:
      columns: '*'
      filter: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
