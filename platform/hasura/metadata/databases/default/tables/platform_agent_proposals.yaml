table:
  name: agent_proposals
  schema: platform
select_permissions:
  - role: manager
    permission:
      columns:
        - id
        - agent
        - kind
        - status
        - risk
        - origin
        - created_at
        - decided_at
      filter: {_and: [{htx_code: {_eq: X-Hasura-Htx-Code}}, {htx_code: {_neq: ''}}]}
