table:
  name: disease_reports
  schema: public
object_relationships:
  - name: household
    using:
      foreign_key_constraint_on: household_id
  - name: parcel
    using:
      foreign_key_constraint_on: parcel_id
select_permissions:
  - role: farmer
    permission:
      columns: '*'
      filter: {household: {keycloak_user_id: {_eq: X-Hasura-User-Id}}}
  - role: manager
    permission:
      columns: '*'
      filter: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}
  - role: officer
    permission:
      columns: '*'
      filter: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}
  - role: agent
    permission:
      columns:
        - id
        - parcel_id
        - household_id
        - status
        - detection_date
        - created_at
        - updated_at
      allow_aggregations: true
      filter: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}
