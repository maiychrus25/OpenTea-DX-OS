table:
  name: parcels
  schema: public
object_relationships:
  - name: household
    using:
      foreign_key_constraint_on: household_id
select_permissions:
  - role: farmer
    permission:
      columns: '*'
      filter: {household: {keycloak_user_id: {_eq: X-Hasura-User-Id}}}
  - role: manager
    permission:
      columns: '*'
      filter: {household: {htx_profile: {htx_code: {_eq: X-Hasura-Htx-Code}}}}
  - role: officer
    permission:
      columns: '*'
      filter: {household: {htx_profile: {htx_code: {_eq: X-Hasura-Htx-Code}}}}
