table:
  name: parcels
  schema: public
object_relationships:
  - name: household
    using:
      foreign_key_constraint_on: household_id
array_relationships:
  - name: crop_cycles
    using:
      foreign_key_constraint_on:
        column: parcel_id
        table:
          name: parcel_crop_cycles
          schema: public
select_permissions:
  - role: farmer
    permission:
      columns: '*'
      filter: {household: {keycloak_user_id: {_eq: X-Hasura-User-Id}}}
  - role: manager
    permission:
      columns: '*'
      filter: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}
  - role: officer
    permission:
      columns: '*'
      filter: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}
