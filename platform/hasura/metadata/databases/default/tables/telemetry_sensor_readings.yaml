table:
  name: sensor_readings
  schema: telemetry
select_permissions:
  - role: manager
    permission:
      columns: '*'
      filter: {_and: [{htx_code: {_eq: X-Hasura-Htx-Code}}, {htx_code: {_neq: ''}}]}
  - role: officer
    permission:
      columns: '*'
      filter: {_and: [{htx_code: {_eq: X-Hasura-Htx-Code}}, {htx_code: {_neq: ''}}]}
