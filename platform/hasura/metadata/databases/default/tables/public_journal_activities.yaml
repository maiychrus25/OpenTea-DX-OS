table:
  name: journal_activities
  schema: public
object_relationships:
  - name: journal_entry
    using:
      foreign_key_constraint_on: journal_entry_id
select_permissions:
  - role: farmer
    permission:
      columns: '*'
      filter: {journal_entry: {parcel: {household: {keycloak_user_id: {_eq: X-Hasura-User-Id}}}}}
  - role: manager
    permission:
      columns: '*'
      filter: {journal_entry: {parcel: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}}}
  - role: officer
    permission:
      columns: '*'
      filter: {journal_entry: {parcel: {household: {htx_profile: {_and: [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}}}}
