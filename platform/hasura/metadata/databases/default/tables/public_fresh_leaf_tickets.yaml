table:
  name: fresh_leaf_tickets
  schema: public
object_relationships:
  - name: htx_profile
    using:
      foreign_key_constraint_on: htx_profile_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - household_id
        - parcel_id
        - cycle_id
        - weighed_at
        - net_kg
        - status
      allow_aggregations: true
      filter: {htx_profile: {'_and': [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
