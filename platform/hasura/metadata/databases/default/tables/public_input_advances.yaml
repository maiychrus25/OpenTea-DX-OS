table:
  name: input_advances
  schema: public
object_relationships:
  - name: htx_profile
    using:
      foreign_key_constraint_on: htx_profile_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - household_id
        - item_id
        - quantity
        - advanced_on
        - status
        - settlement_id
      allow_aggregations: true
      filter: {htx_profile: {'_and': [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
