table:
  name: processing_batches
  schema: public
object_relationships:
  - name: htx_profile
    using:
      foreign_key_constraint_on: htx_profile_id
select_permissions:
  - role: agent
    permission:
      columns:
        - id
        - status
        - processed_on
        - fresh_kg
        - dry_kg
        - recovery_ratio
        - out_of_band
      allow_aggregations: true
      filter: {htx_profile: {'_and': [{'htx_code': {'_eq': 'X-Hasura-Htx-Code'}}, {'htx_code': {'_neq': ''}}]}}
