services:
  postgres:
    build: ../platform/postgres
    image: opentea-dx-os/postgres:local
    container_name: agrimarket-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
      # The init script will create the keycloak db and user
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../platform/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ../platform/postgres/init/02-audit.sql:/docker-entrypoint-initdb.d/02-audit.sql
      - ../platform/postgres/init/03-audit-triggers.sql:/docker-entrypoint-initdb.d/03-audit-triggers.sql
      - ../platform/postgres/init/04-telemetry.sql:/docker-entrypoint-initdb.d/04-telemetry.sql
      - ../platform/postgres/init/05-apps.sql:/docker-entrypoint-initdb.d/05-apps.sql
      - ../platform/postgres/init/06-app-store.sql:/docker-entrypoint-initdb.d/06-app-store.sql
      - ../platform/postgres/init/07-telemetry-views.sql:/docker-entrypoint-initdb.d/07-telemetry-views.sql
      - ../platform/postgres/init/08-agent.sql:/docker-entrypoint-initdb.d/08-agent.sql
      - ../platform/postgres/init/09-telegram.sql:/docker-entrypoint-initdb.d/09-telegram.sql
      - ../platform/postgres/init/10-zalo.sql:/docker-entrypoint-initdb.d/10-zalo.sql
      - ../platform/postgres/init/11-hasura-agent-metrics.sql:/docker-entrypoint-initdb.d/11-hasura-agent-metrics.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimarket"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrimarket-net
      - dxos-apps-net

  # One-shot: applies every init script (extensions, audit schema) to an already-initialised database (idempotent).
  platform-init:
    image: opentea-dx-os/postgres:local
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    command: ["sh", "-c", "for f in /init/*.sql; do psql -h postgres -U agrimarket -d agrimarket -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]
    volumes:
      - ../platform/postgres/init:/init:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  # One-shot: applies Prisma migrations (run after postgres, before hasura starts).
  migrate:
    build: ../apps/web/prisma
    image: opentea-dx-os/migrate:local
    profiles: ["tools"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: agrimarket-keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # KC_HOSTNAME_URL: full URL để Keycloak biết đúng issuer
      # KHÔNG dùng KC_HOSTNAME (hostname only) vì sẽ bị double port: localhost:8080:8080
      KC_HOSTNAME_URL: "http://localhost:8080"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # Dev heap cap: the default (70% of RAM) let keycloak grow to about 1.1 GiB on a laptop; kc.sh 24.0.5 reads JAVA_OPTS_KC_HEAP.
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_HEAP_OPTS:--Xms64m -Xmx512m}
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  apisix:
    image: apache/apisix:3.19.0-debian
    container_name: agrimarket-apisix
    restart: always
    environment:
      DXOS_CORS_ORIGIN: ${DXOS_CORS_ORIGIN:-http://localhost:3000}
      DXOS_GATEWAY_CLIENT_SECRET: ${DXOS_GATEWAY_CLIENT_SECRET:-dev-gateway-secret}
      DXOS_INTERNAL_GATEWAY_SECRET: ${DXOS_INTERNAL_GATEWAY_SECRET:-dev-internal-gateway-secret}
    volumes:
      - ../platform/gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # Defaults to the tracked base file (release bundle, bare compose: no app routes); make sets the gateway-sync output.
      - ${DXOS_GATEWAY_FILE:-../platform/gateway/apisix.yaml}:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    depends_on:
      keycloak:
        condition: service_started
      hasura:
        condition: service_started
    networks:
      - agrimarket-net
      - dxos-apps-net

  # Read-only GraphQL data API over the Prisma-owned schema (metadata only, no migrations).
  # No host port: reachable only through the APISIX gateway (/api/data/graphql).
  hasura:
    image: hasura/graphql-engine:v2.51.4.cli-migrations-v3
    container_name: agrimarket-hasura
    restart: always
    # Supplies HASURA_GRAPHQL_ADMIN_SECRET; Hasura refuses to start with a JWT secret but no admin secret.
    env_file: .env.local
    environment:
      # env_file loads .env.local into this service; the provider keys belong to dxos-agent only (ADR 0004)
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"http://keycloak:8080/realms/agrimarket/protocol/openid-connect/certs","issuer":"${KC_PUBLIC_ISSUER:-http://localhost:8080/realms/agrimarket}","audience":"dx-os-core","claims_map":{"x-hasura-user-id":{"path":"$$.sub"},"x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},"x-hasura-default-role":{"path":"$$.dxos_default_role","default":"farmer"},"x-hasura-htx-code":{"path":"$$.htx_code","default":""}}}'
    volumes:
      - ../platform/hasura/metadata:/hasura-metadata:ro
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - agrimarket-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: agrimarket-web
    restart: always
    env_file: .env.local
    environment:
      # env_file loads .env.local into this service; the provider keys belong to dxos-agent only (ADR 0004)
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      # Internal URL cho token/userinfo exchange (container-to-container)
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/agrimarket
      KEYCLOAK_ISSUER: ${KC_PUBLIC_ISSUER:-http://localhost:8080/realms/agrimarket}
      CORE_GATEWAY_URL: http://apisix:9081
      DXOS_INTERNAL_GATEWAY_SECRET: ${DXOS_INTERNAL_GATEWAY_SECRET:-dev-internal-gateway-secret}
      # Without it the login redirect_uri is built from HOSTNAME (0.0.0.0) and Keycloak refuses it.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Public mini-app requests per minute per client IP (spec §6.5); CI and a Docker Desktop demo raise it (README).
      DXOS_APP_PUBLIC_LIMIT: ${DXOS_APP_PUBLIC_LIMIT:-10}
      # Signs the Telegram callback buttons (C3). The release override refuses the dev value.
      DXOS_TELEGRAM_CALLBACK_KEY: ${DXOS_TELEGRAM_CALLBACK_KEY:-dev-telegram-callback-key}
      # Derived Mini App key (never the bot token); ./dxos telegram enable also writes it to roles.env. Empty = Mini App off.
      DXOS_TELEGRAM_WEBAPP_KEY: ${DXOS_TELEGRAM_WEBAPP_KEY:-}
      # The web's HTTPS base URL (D17): chat shows the Mini App buttons only when it is set. Same value as the relay's.
      DXOS_WEB_PUBLIC_URL: ${DXOS_WEB_PUBLIC_URL:-}
      # Encrypts the Zalo OA tokens at rest (64 hex characters). The default is a public dev key ("dev-zalo-token-key-not-for-prod!");
      # the release override drops it and refuses it, so a release without its own key cannot store tokens.
      DXOS_ZALO_TOKEN_KEY: ${DXOS_ZALO_TOKEN_KEY:-6465762d7a616c6f2d746f6b656e2d6b65792d6e6f742d666f722d70726f6421}
      HOSTNAME: "0.0.0.0"
      # Frozen features (ADR 0005): app factory, autopilot, strategy agent, MCP, staff sync. Off unless "1" or "true".
      DXOS_LABS: ${DXOS_LABS:-}
    volumes:
      # Client credentials of dxos-web-roles (realm-management view-users), written by ./dxos telegram enable.
      - dxos-web-env:/run/dxos-web:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      apisix:
        condition: service_started
    networks:
      - agrimarket-net

  # NOTE: n8n is an optional, external workflow automation service.
  # n8n uses the Sustainable Use License (source-available, not OSI-approved).
  # DX-AgriMarket does not import, link, or bundle n8n source code.
  # It communicates with n8n only via HTTP API. n8n can be replaced with any
  # workflow engine without affecting the core application.
  n8n:
    image: n8nio/n8n:2.47.2  # License: Sustainable Use License (fair-code)
    container_name: agrimarket-n8n
    restart: always
    env_file: .env.local
    environment:
      # env_file loads .env.local into this service; the provider keys belong to dxos-agent only (ADR 0004)
      - ANTHROPIC_API_KEY=
      - OPENAI_API_KEY=
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=agrimarket
      - DB_POSTGRESDB_SCHEMA=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-agrimarket}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your_n8n_encryption_key_here}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net


  piper:
    image: rhasspy/wyoming-piper:2.5.2
    container_name: agrimarket-piper
    restart: always
    volumes:
      - ../piper-voices:/data
    command: ["--voice", "vi_VN-vais1000-medium"]
    ports:
      - "5500:10200"
    networks:
      - agrimarket-net

  # Speech to text for Telegram voice messages (M15, whisper.cpp, MIT). Part of `make up-voice`; the relay is its only client and
  # no port is published, so audio never leaves the server. The image is amd64 only. --convert makes the server run ffmpeg, which
  # writes a short-lived WAV into the tmpfs /tmp (never to disk). The entrypoint is `bash -c`, hence one command string.
  dxos-stt:
    image: ghcr.io/ggml-org/whisper.cpp:main-bd9e1a12352fa57e448bdea6a0649aa9c24c64aa
    container_name: agrimarket-stt
    restart: always
    mem_limit: 2g
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    command: ["whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-${DXOS_STT_MODEL:-small}.bin -l vi --convert --tmp-dir /tmp"]
    volumes:
      - stt_models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - agrimarket-net

  # One-shot: downloads the model into the stt_models volume and checks its SHA-256 (tools profile, like ollama-init). The URL is
  # pinned to a commit of the Hugging Face repository. Changing the model means changing DXOS_STT_MODEL (base, small or medium).
  stt-init:
    image: ghcr.io/ggml-org/whisper.cpp:main-bd9e1a12352fa57e448bdea6a0649aa9c24c64aa
    profiles: ["tools"]
    restart: "no"
    user: "0:0"
    environment:
      DXOS_STT_MODEL: ${DXOS_STT_MODEL:-small}
    volumes:
      - stt_models:/models
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$DXOS_STT_MODEL" in
          base) sha=60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe ;;
          small) sha=1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b ;;
          medium) sha=6c14d5adee5f86394037b4e4e8b59f1673b6cee10e3cf0b11bbdbee79c156208 ;;
          *) echo "DXOS_STT_MODEL must be base, small or medium" >&2; exit 1 ;;
        esac
        file="/models/ggml-$$DXOS_STT_MODEL.bin"
        if [ -f "$$file" ] && echo "$$sha  $$file" | sha256sum -c - >/dev/null 2>&1; then echo "$$file is already there"; exit 0; fi
        rm -f "$$file" "$$file.part"
        curl -fsSL --retry 3 -o "$$file.part" "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-$$DXOS_STT_MODEL.bin" \
          && echo "$$sha  $$file.part" | sha256sum -c - || { rm -f "$$file.part"; echo "Model $$DXOS_STT_MODEL did not download or does not match its SHA-256" >&2; exit 1; }
        mv "$$file.part" "$$file"
    networks:
      - agrimarket-net

  # NOTE: MinIO is an S3-compatible object storage (AGPL-3.0, OSI-approved).
  # S3-compatible object storage (SeaweedFS, Apache-2.0). Serves S3 on 9000 under the
  # network alias "minio" so apps/web (minio client, port 9000) works unchanged.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: agrimarket-seaweedfs
    restart: always
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-your_minio_secret_key}
    volumes:
      - seaweedfs_data:/data
      - ../platform/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      agrimarket-net:
        aliases:
          - minio

  # Antivirus daemon for upload scanning (clamd INSTREAM on 3310, internal only).
  # CLAMD_CONF_* is the image's documented clamd.conf override mechanism.
  clamav:
    image: clamav/clamav-debian:1.4.6
    container_name: agrimarket-clamav
    restart: always
    environment:
      # StreamMaxLength and the scanner's DXOS_MAX_SCAN_BYTES (52428800) must change together.
      CLAMD_CONF_StreamMaxLength: 50M
      # Fail closed: clamd answers "<heuristic> FOUND" (-> quarantine) instead of "OK" for encrypted
      # archives and for archives over a scan limit (nesting depth, size, time). Encrypted documents
      # (AlertEncryptedDoc, e.g. password-protected PDFs) stay allowed on purpose.
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertExceedsMax: "yes"
      # Must stay below the scanner's 30 s client budget (scan_stream) so a slow scan is a verdict, not a retry loop.
      CLAMD_CONF_MaxScanTime: "25000"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - agrimarket-net

  # Polls S3 buckets, scans new objects with clamd, quarantines infected ones (no host port).
  dxos-scanner:
    build: ../platform/scanner
    image: opentea-dx-os/scanner:local
    container_name: agrimarket-scanner
    restart: always
    environment:
      DXOS_SCAN_BUCKETS: agrimarket-docs,agrimarket-private
      DXOS_QUARANTINE_BUCKET: dxos-quarantine
      DXOS_SCAN_INTERVAL_SECONDS: "5"
      DXOS_S3_ENDPOINT: minio:9000
      DXOS_CLAMD_HOST: clamav
      DXOS_CLAMD_PORT: "3310"
      DXOS_MAX_SCAN_BYTES: "52428800"  # = CLAMD_CONF_StreamMaxLength (50M); change both together
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-your_minio_secret_key}
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
    healthcheck:
      # Healthy while the heartbeat (touched per object and per round) is younger than max(3 x interval, 60s).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-scanner.heartbeat')) < max(3*float(os.environ.get('DXOS_SCAN_INTERVAL_SECONDS','5')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - agrimarket-net

  # MQTT broker for sensor telemetry. No host port: only reachable inside agrimarket-net.
  # Accounts come from DXOS_MQTT_* in .env.local; entrypoint.sh builds the password file at start.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: agrimarket-mosquitto
    restart: always
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file: .env.local
    environment:
      # env_file loads .env.local into this service; the provider keys belong to dxos-agent only (ADR 0004)
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    volumes:
      - ../platform/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../platform/mosquitto/acl:/mosquitto/config/acl:ro
      - ../platform/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agrimarket-net

  # Consumes MQTT sensor readings into telemetry.sensor_readings (acks after commit; no host port).
  dxos-ingest:
    build: ../platform/dataops
    image: opentea-dx-os/dataops:local
    container_name: agrimarket-ingest
    restart: always
    command: ["python", "-m", "dxos_dataops", "ingest"]
    env_file: .env.local
    environment:
      # env_file loads .env.local into this service; the provider keys belong to dxos-agent only (ADR 0004)
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
    healthcheck:
      # Healthy while the heartbeat (touched per message and every 30 s while connected) is younger than 90 s.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-dataops.heartbeat')) < 90 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - agrimarket-net

  # Archives sensor readings past the hot retention to Parquet in dxos-lake, with lineage (no host port).
  dxos-lifecycle:
    build: ../platform/dataops
    image: opentea-dx-os/dataops:local
    container_name: agrimarket-lifecycle
    restart: always
    command: ["python", "-m", "dxos_dataops", "lifecycle"]
    environment:
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
      DXOS_S3_ENDPOINT: minio:9000
      DXOS_HOT_RETENTION_DAYS: ${DXOS_HOT_RETENTION_DAYS:-30}
      DXOS_LIFECYCLE_INTERVAL_SECONDS: ${DXOS_LIFECYCLE_INTERVAL_SECONDS:-3600}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-your_minio_secret_key}
    healthcheck:
      # Healthy while the heartbeat (touched per partition and per round) is younger than max(3 x interval, 60s).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-dataops.heartbeat')) < max(3*float(os.environ.get('DXOS_LIFECYCLE_INTERVAL_SECONDS','3600')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - agrimarket-net

  # Demo only (profile "demo"): publishes simulated readings for the parcels of the HTXs in DXOS_MQTT_DEVICES.
  dxos-simulator:
    build: ../platform/dataops
    image: opentea-dx-os/dataops:local
    container_name: agrimarket-simulator
    profiles: ["demo"]
    restart: unless-stopped
    command: ["python", "-m", "dxos_dataops", "simulate"]
    env_file: .env.local
    environment:
      # env_file loads .env.local into this service; the provider keys belong to dxos-agent only (ADR 0004)
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - agrimarket-net

  # Agentic layer (docs/specs/2026-11-23-agentic-layer-design.md, ADR 0003).
  dxos-agent:
    build: ../platform/agent
    image: opentea-dx-os/agent:local
    container_name: agrimarket-agent
    restart: always
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp:size=16m"]  # heartbeat file
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: "0.5"
    environment:
      DXOS_AGENT_INTERVAL_SECONDS: ${DXOS_AGENT_INTERVAL_SECONDS:-30}
      DXOS_GATEWAY_URL: http://apisix:9081
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/agrimarket
      DXOS_AGENT_ENV_DIR: /run/dxos-agent
      DXOS_LLM_MODEL: ${DXOS_LLM_MODEL:-qwen2.5:0.5b}
      # External LLM providers (ADR 0004). The keys exist only in this container; empty keys leave every agent on Ollama.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_BASE: ${ANTHROPIC_API_BASE:-https://api.anthropic.com}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com}
      DXOS_ANTHROPIC_MODEL: ${DXOS_ANTHROPIC_MODEL:-claude-haiku-5-5}
      DXOS_OPENAI_MODEL: ${DXOS_OPENAI_MODEL:-}
      # Frozen jobs (staff, app-builder, strategy, autopilot tick) are skipped unless "1" or "true" (ADR 0005).
      DXOS_LABS: ${DXOS_LABS:-}
    volumes:
      - dxos-agent-env:/run/dxos-agent:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-agent.heartbeat')) < max(3*float(os.environ.get('DXOS_AGENT_INTERVAL_SECONDS','30')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - agrimarket-net

  # Writes and removes the agent credential files for ./dxos agent (tools profile only). Root with no network: the files
  # are owned by the agent's uid 10001, so the agent reads them and no other host user can.
  dxos-agent-env:
    build: ../platform/agent
    image: opentea-dx-os/agent:local
    profiles: ["tools"]
    restart: "no"
    user: "0:0"
    network_mode: none
    volumes:
      - dxos-agent-env:/run/dxos-agent

  dxos-telegram:
    build: ../platform/telegram
    image: opentea-dx-os/telegram:local
    container_name: agrimarket-telegram
    restart: always
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp:size=16m"]  # heartbeat file
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: "0.5"
    environment:
      DXOS_TELEGRAM_INTERVAL_SECONDS: "30"
      # Set in docker/.env.local (or the shell). Without it the relay idles and the rest of the stack is unaffected.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      DXOS_GATEWAY_URL: http://apisix:9081
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/agrimarket
      DXOS_TELEGRAM_ENV_DIR: /run/dxos-telegram
      # The web's HTTPS base URL (D17). Empty = no Mini App menu button; chat keeps working.
      DXOS_WEB_PUBLIC_URL: ${DXOS_WEB_PUBLIC_URL:-}
      # Voice messages (M15): only dxos-stt, localhost or a private address is accepted. Without `make up-voice` the relay answers that voice is unavailable.
      DXOS_STT_URL: ${DXOS_STT_URL:-http://dxos-stt:8080}
    volumes:
      - dxos-telegram-env:/run/dxos-telegram:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-telegram.heartbeat')) < max(3*float(os.environ.get('DXOS_TELEGRAM_INTERVAL_SECONDS','30')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - agrimarket-net

  # Writes the relay and roles credential files for ./dxos telegram (tools profile only). Root with no network, like dxos-agent-env.
  dxos-telegram-env:
    build: ../platform/telegram
    image: opentea-dx-os/telegram:local
    profiles: ["tools"]
    restart: "no"
    user: "0:0"
    network_mode: none
    volumes:
      - dxos-telegram-env:/run/dxos-telegram
      - dxos-web-env:/run/dxos-web

  # Test double of the Bot API for the platform smoke test (profile telegram-test only). Host port is loopback-only.
  dxos-telegram-stub:
    build: ../platform/telegram
    image: opentea-dx-os/telegram:local
    profiles: ["telegram-test"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-m", "dxos_telegram.stub_bot_api"]
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - agrimarket-net

  # Zalo ZNS relay (GĐ4-C). Without OA tokens in the web it only sends heartbeats and stays healthy.
  dxos-zalo:
    build: ../platform/zalo
    image: opentea-dx-os/zalo:local
    container_name: agrimarket-zalo
    restart: always
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp:size=16m"]  # heartbeat file
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: "0.5"
    environment:
      DXOS_ZALO_INTERVAL_SECONDS: "30"
      ZALO_API_BASE: ${ZALO_API_BASE:-https://business.openapi.zalo.me}
      ZALO_OAUTH_URL: ${ZALO_OAUTH_URL:-https://oauth.zaloapp.com/v4/oa/access_token}
      # The OA's app id and secret refresh the OA token; the tokens themselves live in the web (platform.zalo_credentials).
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      DXOS_GATEWAY_URL: http://apisix:9081
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/agrimarket
      DXOS_ZALO_ENV_DIR: /run/dxos-zalo
    volumes:
      - dxos-zalo-env:/run/dxos-zalo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-zalo.heartbeat')) < max(3*float(os.environ.get('DXOS_ZALO_INTERVAL_SECONDS','30')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - agrimarket-net

  # Writes the relay's Keycloak client credentials for ./dxos zalo (tools profile only). Root with no network, like dxos-agent-env.
  dxos-zalo-env:
    build: ../platform/zalo
    image: opentea-dx-os/zalo:local
    profiles: ["tools"]
    restart: "no"
    user: "0:0"
    network_mode: none
    volumes:
      - dxos-zalo-env:/run/dxos-zalo

  # Test double of the ZNS API for the platform smoke test (profile zalo-test only). Host port is loopback-only.
  dxos-zalo-stub:
    build: ../platform/zalo
    image: opentea-dx-os/zalo:local
    profiles: ["zalo-test"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-m", "dxos_zalo.stub_zns_api"]
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - agrimarket-net

  # Test-only stand-in for dxos-stt (platform/tests/stub_stt.py): the voice smoke runs it instead of whisper.cpp, under the
  # network alias dxos-stt that the relay posts to. Never started together with the real dxos-stt; not in the release bundle.
  stt-test-stub:
    image: python:3.12.15-slim-bookworm
    profiles: ["stt-test"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # The relay posts to dxos-stt:8080 (its default DXOS_STT_URL), so the stub listens there under that alias.
      DXOS_STT_STUB_PORT: "8080"
    volumes:
      - ../platform/tests/stub_stt.py:/app/stub_stt.py:ro
    command: ["python", "-u", "/app/stub_stt.py"]
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      agrimarket-net:
        aliases: [dxos-stt]

  # Test-only stand-in for the Anthropic and OpenAI APIs (platform/tests/stub_llm.py). The agentic smoke points dxos-agent
  # at it with ANTHROPIC_API_BASE; it is never in the release bundle.
  llm-test-stub:
    image: python:3.12.15-slim-bookworm
    profiles: ["llm-test"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../platform/tests/stub_llm.py:/app/stub_llm.py:ro
    command: ["python", "-u", "/app/stub_llm.py"]
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - agrimarket-net

  disease-api:
    build:
      context: ../apps/disease-api
      dockerfile: Dockerfile
    container_name: agrimarket-disease-api
    restart: always
    # AD-8: NO external port mapping — only Next.js proxy calls this service
    expose:
      - "8000"
    volumes:
      - ../ai-models:/models:ro
    environment:
      - MODEL_DIR=/models
      # Tea results below this confidence are returned as uncertain (default from ai-models/tea/MODEL_CARD.md).
      - TEA_CONFIDENCE_THRESHOLD=${TEA_CONFIDENCE_THRESHOLD:-0.60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Loading both TensorFlow models takes a while on a cold machine; failed checks in this window do not count.
      start_period: 60s
    networks:
      - agrimarket-net

  # In-house LLM (MIT). No host port: reachable only through the gateway (/api/ai/llm/v1/chat/completions).
  ollama:
    image: ollama/ollama:0.40.15
    container_name: agrimarket-ollama
    restart: always
    mem_limit: 2g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "8"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - agrimarket-net

  # One-shot: pulls the model and checks its ID. Changing the model means changing both variables.
  ollama-init:
    image: ollama/ollama:0.40.15
    profiles: ["tools"]
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      DXOS_LLM_MODEL: ${DXOS_LLM_MODEL:-qwen2.5:0.5b}
      DXOS_LLM_MODEL_ID: ${DXOS_LLM_MODEL_ID:-a8b0c5157701}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull "$$DXOS_LLM_MODEL" && ollama list | awk -v m="$$DXOS_LLM_MODEL" -v id="$$DXOS_LLM_MODEL_ID" '$$1==m && $$2==id {found=1} END {exit !found}' || { echo "Model $$DXOS_LLM_MODEL does not match ID $$DXOS_LLM_MODEL_ID" >&2; ollama list >&2; exit 1; }
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - agrimarket-net

  mattermost:
    image: mattermost/mattermost-team-edition:12.1.0
    container_name: agrimarket-mattermost
    restart: always

    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS=true
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_config:/mattermost/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  # One-shot mini-app CLI (profile tools, no host port, no docker socket). Run with
  # --user "$(id -u):$(id -g)": the image default is non-root uid 10001, but the bind-mounted
  # docker/runtime must stay writable for the host (and Linux CI) user.
  # Runtime state is per compose project (R13): this project's docker/runtime/<project> is the CLI's docker/runtime.
  dxos-cli:
    build: ../platform/cli
    image: opentea-dx-os/cli:local
    profiles: ["tools"]
    restart: "no"
    environment:
      DXOS_REPO_ROOT: /repo
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
      # Same expression as the mount below, so the generated env_file path and the mount never disagree.
      DXOS_RUNTIME_SUBDIR: ${COMPOSE_PROJECT_NAME:-docker}
    volumes:
      - ../miniapps:/repo/miniapps:ro
      - ../platform:/repo/platform:ro
      - ../apps/web/package.json:/repo/apps/web/package.json:ro
      - ./runtime/${COMPOSE_PROJECT_NAME:-docker}:/repo/docker/runtime
    networks:
      - agrimarket-net

  # Mini-app factory (plan M13). The image is built by platform/builder/build-image.sh, never left running: ./dxos builder
  # starts one throwaway container per step with `docker run` (compose cannot give a run `--network none`). This service
  # only names the image and the network; the proxy below is the build container's only way out.
  dxos-builder:
    image: ${DXOS_BUILDER_IMAGE:-opentea-dx-os/builder:local}
    profiles: ["builder"]
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    networks:
      - dxos-builder-net

  # Allowlist CONNECT proxy (Python standard library). Hosts: DXOS_BUILDER_ALLOW_HOSTS, set by ./dxos builder from the
  # configured provider base URLs; another host gets 403 and a log line. No `:-` on purpose: an empty list refuses everything.
  dxos-builder-proxy:
    image: python:3.12.15-slim-bookworm
    profiles: ["builder"]
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DXOS_BUILDER_ALLOW_HOSTS: ${DXOS_BUILDER_ALLOW_HOSTS-api.anthropic.com,api.openai.com}
    volumes:
      - ../platform/builder/proxy.py:/proxy.py:ro
    command: ["python", "-u", "/proxy.py"]
    networks:
      - dxos-builder-net
      - agrimarket-net

volumes:
  pgdata:
  n8n_data:
  seaweedfs_data:
  clamav_db:
  mosquitto_data:
  ollama_data:
  stt_models:
  mattermost_data:
  mattermost_config:
  dxos-agent-env:
  dxos-telegram-env:
  dxos-zalo-env:
  dxos-web-env:

networks:
  agrimarket-net:
    driver: bridge
  # Mini-app containers live only here, with apisix and postgres (spec §6.2); internal, so apps have no egress either.
  dxos-apps-net:
    driver: bridge
    internal: true
  # The build container of the mini-app factory lives only here, with the proxy; internal, so the only way out is the proxy.
  dxos-builder-net:
    driver: bridge
    internal: true
