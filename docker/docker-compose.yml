#    image: ollama/ollama:latest  # License: MIT
#    container_name: agrimarket-ollama
#    restart: always
#    ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    healthcheck:
#      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 10s
#    networks:
#      - agrimarket-net

  mattermost:
    image: mattermost/mattermost-team-edition:12.1.0
    container_name: agrimarket-mattermost
    restart: always

    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS=true
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_config:/mattermost/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

volumes:
  pgdata:
  n8n_data:
  seaweedfs_data:
  clamav_db:
  ollama_data:
  mattermost_data:
  mattermost_config:

networks:
  agrimarket-net:
    driver: bridge
