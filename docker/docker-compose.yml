services:
  postgres:
    build: ../platform/postgres
    image: opentea-dx-os/postgres:local
    container_name: agrimarket-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
      # The init script will create the keycloak db and user
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../platform/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ../platform/postgres/init/02-audit.sql:/docker-entrypoint-initdb.d/02-audit.sql
      - ../platform/postgres/init/03-audit-triggers.sql:/docker-entrypoint-initdb.d/03-audit-triggers.sql
      - ../platform/postgres/init/04-telemetry.sql:/docker-entrypoint-initdb.d/04-telemetry.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimarket"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrimarket-net
      - dxos-apps-net

  # One-shot: applies every init script (extensions, audit schema) to an already-initialised database (idempotent).
  platform-init:
    image: opentea-dx-os/postgres:local
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    command: ["sh", "-c", "for f in /init/*.sql; do psql -h postgres -U agrimarket -d agrimarket -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]
    volumes:
      - ../platform/postgres/init:/init:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  # One-shot: applies Prisma migrations (run after postgres, before hasura starts).
  migrate:
    build: ../apps/web/prisma
    image: opentea-dx-os/migrate:local
    profiles: ["tools"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: agrimarket-keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # KC_HOSTNAME_URL: full URL để Keycloak biết đúng issuer
      # KHÔNG dùng KC_HOSTNAME (hostname only) vì sẽ bị double port: localhost:8080:8080
      KC_HOSTNAME_URL: "http://localhost:8080"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  apisix:
    image: apache/apisix:3.19.0-debian
    container_name: agrimarket-apisix
    restart: always
    environment:
      DXOS_CORS_ORIGIN: ${DXOS_CORS_ORIGIN:-http://localhost:3000}
      DXOS_GATEWAY_CLIENT_SECRET: ${DXOS_GATEWAY_CLIENT_SECRET:-dev-gateway-secret}
    volumes:
      - ../platform/gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # Defaults to the tracked base file (release bundle, bare compose: no app routes); make sets the gateway-sync output.
      - ${DXOS_GATEWAY_FILE:-../platform/gateway/apisix.yaml}:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    depends_on:
      keycloak:
        condition: service_started
      hasura:
        condition: service_started
    networks:
      - agrimarket-net
      - dxos-apps-net

  # Read-only GraphQL data API over the Prisma-owned schema (metadata only, no migrations).
  # No host port: reachable only through the APISIX gateway (/api/data/graphql).
  hasura:
    image: hasura/graphql-engine:v2.51.4.cli-migrations-v3
    container_name: agrimarket-hasura
    restart: always
    # Supplies HASURA_GRAPHQL_ADMIN_SECRET; Hasura refuses to start with a JWT secret but no admin secret.
    env_file: .env.local
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"http://keycloak:8080/realms/agrimarket/protocol/openid-connect/certs","issuer":"${KC_PUBLIC_ISSUER:-http://localhost:8080/realms/agrimarket}","audience":"dx-os-core","claims_map":{"x-hasura-user-id":{"path":"$$.sub"},"x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},"x-hasura-default-role":{"path":"$$.dxos_default_role","default":"farmer"},"x-hasura-htx-code":{"path":"$$.htx_code","default":""}}}'
    volumes:
      - ../platform/hasura/metadata:/hasura-metadata:ro
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - agrimarket-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: agrimarket-web
    restart: always
    env_file: .env.local
    environment:
      # Internal URL cho token/userinfo exchange (container-to-container)
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/agrimarket
      KEYCLOAK_ISSUER: ${KC_PUBLIC_ISSUER:-http://localhost:8080/realms/agrimarket}
      CORE_GATEWAY_URL: http://apisix:9081
      # Without it the login redirect_uri is built from HOSTNAME (0.0.0.0) and Keycloak refuses it.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      apisix:
        condition: service_started
    networks:
      - agrimarket-net

  # NOTE: n8n is an optional, external workflow automation service.
  # n8n uses the Sustainable Use License (source-available, not OSI-approved).
  # DX-AgriMarket does not import, link, or bundle n8n source code.
  # It communicates with n8n only via HTTP API. n8n can be replaced with any
  # workflow engine without affecting the core application.
  n8n:
    image: n8nio/n8n:2.47.2  # License: Sustainable Use License (fair-code)
    container_name: agrimarket-n8n
    restart: always
    env_file: .env.local
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=agrimarket
      - DB_POSTGRESDB_SCHEMA=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-agrimarket}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-your_password_here}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your_n8n_encryption_key_here}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net


  piper:
    image: rhasspy/wyoming-piper:2.5.2
    container_name: agrimarket-piper
    restart: always
    volumes:
      - ../piper-voices:/data
    command: ["--voice", "vi_VN-vais1000-medium"]
    ports:
      - "5500:10200"
    networks:
      - agrimarket-net

  # NOTE: MinIO is an S3-compatible object storage (AGPL-3.0, OSI-approved).
  # S3-compatible object storage (SeaweedFS, Apache-2.0). Serves S3 on 9000 under the
  # network alias "minio" so apps/web (minio client, port 9000) works unchanged.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: agrimarket-seaweedfs
    restart: always
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-your_minio_secret_key}
    volumes:
      - seaweedfs_data:/data
      - ../platform/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      agrimarket-net:
        aliases:
          - minio

  # Antivirus daemon for upload scanning (clamd INSTREAM on 3310, internal only).
  # CLAMD_CONF_* is the image's documented clamd.conf override mechanism.
  clamav:
    image: clamav/clamav-debian:1.4.6
    container_name: agrimarket-clamav
    restart: always
    environment:
      # StreamMaxLength and the scanner's DXOS_MAX_SCAN_BYTES (52428800) must change together.
      CLAMD_CONF_StreamMaxLength: 50M
      # Fail closed: clamd answers "<heuristic> FOUND" (-> quarantine) instead of "OK" for encrypted
      # archives and for archives over a scan limit (nesting depth, size, time). Encrypted documents
      # (AlertEncryptedDoc, e.g. password-protected PDFs) stay allowed on purpose.
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertExceedsMax: "yes"
      # Must stay below the scanner's 30 s client budget (scan_stream) so a slow scan is a verdict, not a retry loop.
      CLAMD_CONF_MaxScanTime: "25000"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - agrimarket-net

  # Polls S3 buckets, scans new objects with clamd, quarantines infected ones (no host port).
  dxos-scanner:
    build: ../platform/scanner
    image: opentea-dx-os/scanner:local
    container_name: agrimarket-scanner
    restart: always
    environment:
      DXOS_SCAN_BUCKETS: agrimarket-docs,agrimarket-private
      DXOS_QUARANTINE_BUCKET: dxos-quarantine
      DXOS_SCAN_INTERVAL_SECONDS: "5"
      DXOS_S3_ENDPOINT: minio:9000
      DXOS_CLAMD_HOST: clamav
      DXOS_CLAMD_PORT: "3310"
      DXOS_MAX_SCAN_BYTES: "52428800"  # = CLAMD_CONF_StreamMaxLength (50M); change both together
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-your_minio_secret_key}
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
    healthcheck:
      # Healthy while the heartbeat (touched per object and per round) is younger than max(3 x interval, 60s).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-scanner.heartbeat')) < max(3*float(os.environ.get('DXOS_SCAN_INTERVAL_SECONDS','5')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - agrimarket-net

  # MQTT broker for sensor telemetry. No host port: only reachable inside agrimarket-net.
  # Accounts come from DXOS_MQTT_* in .env.local; entrypoint.sh builds the password file at start.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: agrimarket-mosquitto
    restart: always
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file: .env.local
    volumes:
      - ../platform/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../platform/mosquitto/acl:/mosquitto/config/acl:ro
      - ../platform/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1883"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agrimarket-net

  # Consumes MQTT sensor readings into telemetry.sensor_readings (acks after commit; no host port).
  dxos-ingest:
    build: ../platform/dataops
    image: opentea-dx-os/dataops:local
    container_name: agrimarket-ingest
    restart: always
    command: ["python", "-m", "dxos_dataops", "ingest"]
    env_file: .env.local
    environment:
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
    healthcheck:
      # Healthy while the heartbeat (touched per message and every 30 s while connected) is younger than 90 s.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-dataops.heartbeat')) < 90 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - agrimarket-net

  # Archives sensor readings past the hot retention to Parquet in dxos-lake, with lineage (no host port).
  dxos-lifecycle:
    build: ../platform/dataops
    image: opentea-dx-os/dataops:local
    container_name: agrimarket-lifecycle
    restart: always
    command: ["python", "-m", "dxos_dataops", "lifecycle"]
    environment:
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
      DXOS_S3_ENDPOINT: minio:9000
      DXOS_HOT_RETENTION_DAYS: ${DXOS_HOT_RETENTION_DAYS:-30}
      DXOS_LIFECYCLE_INTERVAL_SECONDS: ${DXOS_LIFECYCLE_INTERVAL_SECONDS:-3600}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-your_minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-your_minio_secret_key}
    healthcheck:
      # Healthy while the heartbeat (touched per partition and per round) is younger than max(3 x interval, 60s).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('DXOS_HEARTBEAT_PATH','/tmp/dxos-dataops.heartbeat')) < max(3*float(os.environ.get('DXOS_LIFECYCLE_INTERVAL_SECONDS','3600')),60) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - agrimarket-net

  # Demo only (profile "demo"): publishes simulated readings for the parcels of the HTXs in DXOS_MQTT_DEVICES.
  dxos-simulator:
    build: ../platform/dataops
    image: opentea-dx-os/dataops:local
    container_name: agrimarket-simulator
    profiles: ["demo"]
    restart: unless-stopped
    command: ["python", "-m", "dxos_dataops", "simulate"]
    env_file: .env.local
    environment:
      DXOS_DB_URL: postgresql://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/agrimarket
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - agrimarket-net

  disease-api:
    build:
      context: ../apps/disease-api
      dockerfile: Dockerfile
    container_name: agrimarket-disease-api
    restart: always
    # AD-8: NO external port mapping — only Next.js proxy calls this service
    expose:
      - "8000"
    volumes:
      - ../ai-models:/models:ro
    environment:
      - MODEL_DIR=/models
      # Tea results below this confidence are returned as uncertain (default from ai-models/tea/MODEL_CARD.md).
      - TEA_CONFIDENCE_THRESHOLD=${TEA_CONFIDENCE_THRESHOLD:-0.60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Loading both TensorFlow models takes a while on a cold machine; failed checks in this window do not count.
      start_period: 60s
    networks:
      - agrimarket-net

  # In-house LLM (MIT). No host port: reachable only through the gateway (/api/ai/llm/v1/chat/completions).
  ollama:
    image: ollama/ollama:0.40.15
    container_name: agrimarket-ollama
    restart: always
    mem_limit: 2g
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "8"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - agrimarket-net

  # One-shot: pulls the model and checks its ID. Changing the model means changing both variables.
  ollama-init:
    image: ollama/ollama:0.40.15
    profiles: ["tools"]
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      DXOS_LLM_MODEL: ${DXOS_LLM_MODEL:-qwen2.5:0.5b}
      DXOS_LLM_MODEL_ID: ${DXOS_LLM_MODEL_ID:-a8b0c5157701}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull "$$DXOS_LLM_MODEL" && ollama list | awk -v m="$$DXOS_LLM_MODEL" -v id="$$DXOS_LLM_MODEL_ID" '$$1==m && $$2==id {found=1} END {exit !found}' || { echo "Model $$DXOS_LLM_MODEL does not match ID $$DXOS_LLM_MODEL_ID" >&2; ollama list >&2; exit 1; }
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - agrimarket-net

  mattermost:
    image: mattermost/mattermost-team-edition:12.1.0
    container_name: agrimarket-mattermost
    restart: always

    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER:-agrimarket}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS=true
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_config:/mattermost/config
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrimarket-net

  # One-shot mini-app CLI (profile tools, no host port, no docker socket). Run with
  # --user "$(id -u):$(id -g)": the image default is non-root uid 10001, but the bind-mounted
  # docker/runtime must stay writable for the host (and Linux CI) user.
  dxos-cli:
    build: ../platform/cli
    image: opentea-dx-os/cli:local
    profiles: ["tools"]
    restart: "no"
    environment:
      DXOS_REPO_ROOT: /repo
    volumes:
      - ../miniapps:/repo/miniapps:ro
      - ../platform:/repo/platform:ro
      - ../apps/web/package.json:/repo/apps/web/package.json:ro
      - ./runtime:/repo/docker/runtime
    networks:
      - agrimarket-net

volumes:
  pgdata:
  n8n_data:
  seaweedfs_data:
  clamav_db:
  mosquitto_data:
  ollama_data:
  mattermost_data:
  mattermost_config:

networks:
  agrimarket-net:
    driver: bridge
  # Mini-app containers live only here, with apisix and postgres (spec §6.2); internal, so apps have no egress either.
  dxos-apps-net:
    driver: bridge
    internal: true
