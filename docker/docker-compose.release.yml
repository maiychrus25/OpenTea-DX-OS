# Release override: run web, disease-api, postgres, migrate, dxos-scanner and the dataops services (dxos-ingest, dxos-lifecycle, dxos-simulator) from prebuilt GHCR images instead of building from source.
# Usage (from the release bundle root):
#   export OPENTEA_VERSION=1.2.0
#   docker compose --env-file docker/.env.local -f docker/docker-compose.yml -f docker/docker-compose.release.yml pull web disease-api postgres migrate dxos-scanner dxos-ingest dxos-lifecycle
#   (dxos-simulator, profile demo, shares the dataops image; add it to pull only when running the demo)
#   (see README "Bản phát hành" for the order: postgres, platform-init, migrate, platform-init again, rest, then `--profile tools run --rm ollama-init`;
#   set the secrets in docker/.env.local first: the broker refuses change_me* passwords and SeaweedFS refuses placeholder MINIO_* keys;
#   --env-file on every command is what makes Compose read them, without it the defaults published in this repo apply)
#   ollama and ollama-init use the public pinned ollama/ollama image, so they need no override here.
#   docker compose --env-file docker/.env.local -f docker/docker-compose.yml -f docker/docker-compose.release.yml up -d --no-build
# Requires Docker Compose >= 2.24 for the !reset tag.

services:
  web:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-web:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null

  disease-api:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-api:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null

  # Platform images are prebuilt and published to GHCR like web/api (production never builds).
  postgres:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-postgres:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null
    ports: !reset []

  dxos-scanner:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-scanner:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null

  dxos-ingest:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-dataops:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null

  dxos-lifecycle:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-dataops:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null

  dxos-simulator:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-dataops:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null

  # Refuse to start with placeholder (change_me*) broker passwords.
  mosquitto:
    environment:
      DXOS_MQTT_REQUIRE_STRONG: "1"

  # Refuse to start with empty or placeholder S3 keys: port 9000 is public and the bucket holds the only copy of archived data.
  seaweedfs:
    environment:
      DXOS_S3_REQUIRE_STRONG: "1"

  platform-init:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-postgres:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}

  # Refuse to start with a placeholder admin secret (the gateway also strips the header, defence in depth).
  hasura:
    command:
      - /bin/sh
      - -c
      - |
        case "$$HASURA_GRAPHQL_ADMIN_SECRET" in
          ""|change_me*) echo "Refusing to start: set a strong HASURA_GRAPHQL_ADMIN_SECRET in docker/.env.local" >&2; exit 1;;
        esac
        exec $$HGE_BINARY serve

  # Published on the host: apisix:9080, web:3000, keycloak:8080 and seaweedfs:9000.
  # SeaweedFS 9000 stays public because the web app hands browsers presigned URLs on it
  # (the /storage gateway route cannot validate SigV4); close it when Tier 2 moves storage behind the gateway.
  n8n:
    ports: !reset []

  piper:
    ports: !reset []

  # One-shot: apply Prisma migrations from the prebuilt image (run before starting hasura).
  migrate:
    image: ${OPENTEA_IMAGE_PREFIX:-ghcr.io/maiychrus25/opentea-dx-os}-migrate:${OPENTEA_VERSION:?Set OPENTEA_VERSION to the release version, e.g. 1.2.0}
    build: !reset null
